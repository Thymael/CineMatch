version: 2

models:
  - name: stg_movielens_movies
    description: "Catalogue MovieLens nettoyé et standardisé."
    columns:
      - name: movie_id
        description: "Identifiant unique du film dans MovieLens."
        data_tests:
          - not_null
          - unique
      - name: title
        description: "Titre du film tel qu'il est fourni par MovieLens."
        data_tests:
          - not_null
      - name: genres
        description: "Genres MovieLens séparés par le caractère |."
        data_tests:
          - not_null
  
  - name: stg_movielens_links
    description: "Correspondances nettoyées entre les identifiants MovieLens, IMDb et TMDb."
    columns:
      - name: movie_id
        description: "Identifiant unique du film dans MovieLens."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_movielens_movies')
                field: movie_id
      - name: imdb_id
        description: "Identifiant du film dans IMDb."
      - name: tmdb_id
        description: "Identifiant du film dans TMDb lorsqu'il est disponible."


  - name: stg_movielens_ratings
    description: "Notes MovieLens standardisées."
    columns:
      - name: user_id
        description: "Identifiant anonymisé de l'utilisateur."
        data_tests:
          - not_null
      - name: movie_id
        description: "Identifiant du film MovieLens."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_movielens_movies')
                field: movie_id
      - name: rating
        description: "Note attribuée au film, comprise entre 0,5 et 5."
        data_tests:
          - not_null
      - name: rated_at
        description: "Date et heure auxquelles la note a été enregistrée."
        data_tests:
          - not_null


  - name: stg_movielens_tags
    description: "Tags MovieLens nettoyés et standardisés."
    columns:
      - name: user_id
        description: "Identifiant anonymisé de l'utilisateur."
        data_tests:
          - not_null
      - name: movie_id
        description: "Identifiant du film MovieLens."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_movielens_movies')
                field: movie_id
      - name: tag
        description: "Mot-clé attribué au film par l'utilisateur."
        data_tests:
          - not_null
      - name: tagged_at
        description: "Date et heure auxquelles le tag a été ajouté."
        data_tests:
          - not_null

  - name: stg_tmdb_films
    description: "Informations principales des films collectés depuis TMDb."
    columns:
      - name: tmdb_id
        description: "Identifiant unique du film dans TMDb."
        data_tests:
          - not_null
          - unique
      - name: imdb_id
        description: "Identifiant du film dans IMDb lorsqu'il est disponible."
      - name: title
        description: "Titre du film fourni par TMDb."
        data_tests:
          - not_null
      - name: original_title
        description: "Titre original du film."
      - name: release_date
        description: "Date de sortie du film."
      - name: runtime
        description: "Durée du film en minutes."
      - name: budget
        description: "Budget déclaré du film."
      - name: revenue
        description: "Recettes déclarées du film."
      - name: popularity
        description: "Indice de popularité TMDb."
      - name: vote_average
        description: "Note moyenne des utilisateurs TMDb."
      - name: vote_count
        description: "Nombre de votes TMDb."
      - name: collection_id
        description: "Identifiant de la collection TMDb si le film appartient à une collection."
      - name: collection_name
        description: "Nom de la collection TMDb si le film appartient à une collection."

  - name: stg_tmdb_genres
    description: "Relations entre les films TMDb et leurs genres."
    columns:
      - name: tmdb_id
        description: "Identifiant du film dans TMDb."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tmdb_films')
                field: tmdb_id
      - name: genre_id
        description: "Identifiant du genre dans TMDb."
        data_tests:
          - not_null
      - name: genre_name
        description: "Nom du genre TMDb."
        data_tests:
          - not_null

  - name: stg_tmdb_keywords
    description: "Relations entre les films TMDb et leurs mots-clés."
    columns:
      - name: tmdb_id
        description: "Identifiant du film dans TMDb."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tmdb_films')
                field: tmdb_id
      - name: keyword_id
        description: "Identifiant du mot-clé dans TMDb."
        data_tests:
          - not_null
      - name: keyword_name
        description: "Libellé du mot-clé TMDb."
        data_tests:
          - not_null
