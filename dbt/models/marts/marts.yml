version: 2

models:
  - name: dim_films
    description: "Dimension des films du prototype CineMatch enrichie avec MovieLens et TMDb."
    columns:
      - name: movie_id
        description: "Identifiant unique du film dans MovieLens."
        data_tests:
          - not_null
          - unique

      - name: tmdb_id
        description: "Identifiant unique du film dans TMDb."
        data_tests:
          - not_null
          - unique

      - name: imdb_id
        description: "Identifiant du film dans IMDb."

      - name: title
        description: "Titre du film utilisé dans le catalogue enrichi."
        data_tests:
          - not_null

      - name: release_date
        description: "Date de sortie du film."

      - name: release_year
        description: "Année de sortie dérivée de release_date."

      - name: runtime
        description: "Durée du film en minutes."

      - name: budget
        description: "Budget déclaré dans TMDb."

      - name: revenue
        description: "Recettes déclarées dans TMDb."

      - name: profit
        description: "Différence entre les recettes et le budget déclarés."

      - name: vote_average
        description: "Note moyenne TMDb."

      - name: vote_count
        description: "Nombre de votes TMDb."

  - name: fct_ratings
    description: "Notes MovieLens associées aux films du catalogue enrichi CineMatch."
    columns:
      - name: user_id
        description: "Identifiant anonymisé de l'utilisateur MovieLens."
        data_tests:
          - not_null

      - name: movie_id
        description: "Identifiant MovieLens du film noté."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_films')
                field: movie_id

      - name: rating
        description: "Note attribuée au film."
        data_tests:
          - not_null

      - name: rated_at
        description: "Date et heure d'enregistrement de la note."
        data_tests:
          - not_null

  - name: mart_film_metrics
    description: "Indicateurs analytiques par film pour l'EDA et Power BI."
    columns:
      - name: movie_id
        description: "Identifiant unique du film dans MovieLens."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_films')
                field: movie_id

      - name: title
        description: "Titre du film."
        data_tests:
          - not_null

      - name: rating_count
        description: "Nombre de notes MovieLens reçues par le film."
        data_tests:
          - not_null

      - name: user_count
        description: "Nombre d'utilisateurs MovieLens distincts ayant noté le film."
        data_tests:
          - not_null

      - name: movielens_rating_average
        description: "Note moyenne MovieLens sur 5."
        data_tests:
          - not_null

      - name: tmdb_vote_average
        description: "Note moyenne TMDb sur 10."

      - name: tmdb_vote_average_5
        description: "Note moyenne TMDb ramenée sur une échelle de 5 pour comparaison avec MovieLens."

      - name: rating_gap
        description: "Écart entre la moyenne MovieLens et la moyenne TMDb ramenée sur 5. Une valeur positive indique une note MovieLens plus élevée."

      - name: roi
        description: "Retour sur investissement calculé comme bénéfice divisé par budget lorsque les deux montants sont renseignés."
